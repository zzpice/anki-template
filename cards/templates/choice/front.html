{{#问题}}
<article class="review-sheet" data-review="choice">
  <header class="review-header">
    <span class="review-kind" data-choice-kind>选择</span>
    <div class="review-context">{{#章节}}{{章节}}{{/章节}}</div>
    {{#题型}}<span data-question-type hidden>{{题型}}</span>{{/题型}}
  </header>
  <div class="review-question content">{{问题}}</div>
  <span data-choice-tags hidden>{{Tags}}</span>
  {{#选项}}<div class="review-options" data-options>{{选项}}</div>{{/选项}}
</article>
<script src="_review.js"></script>
{{/问题}}
